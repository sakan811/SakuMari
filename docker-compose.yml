# Core services (always running)
services:
  db:
    image: postgres:17-alpine
    container_name: ${CONTAINER_NAME_PREFIX}-db
    ports:
      - "5432:5432"
    env_file: ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - sakumari

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${CONTAINER_NAME_PREFIX}-pgadmin
    ports:
      - "8080:80"
    env_file: ./.env
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - sakumari

  portainer:
    image: portainer/portainer-ce:latest
    container_name: ${CONTAINER_NAME_PREFIX}-portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: always
    networks:
      - sakumari

  # App service with dynamic pull policy
  app:
    image: ${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG}
    pull_policy: ${PULL_POLICY:-always}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME_PREFIX}-app
    ports:
      - "3000:3000"
    env_file: ./.env
    depends_on:
      db:
        condition: service_healthy
    restart: always
    user: "nextjs:nodejs"
    networks:
      - sakumari

  # Cloudflare tunnel (tunnel profile only)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ${CONTAINER_NAME_PREFIX}-cloudflared
    command:
      [
        "tunnel",
        "--no-autoupdate",
        "run",
        "--token",
        "${CLOUDFLARE_TUNNEL_TOKEN}",
      ]
    restart: always
    networks:
      - sakumari
    profiles:
      - tunnel

volumes:
  postgres_data:
  pgadmin_data:
  portainer_data:

networks:
  sakumari:
    driver: bridge
    name: sakumari
