version: 2.1

jobs:
  e2e-tests:
    parallelism: 4
    machine:
      image: ubuntu-2204:2024.11.1
    environment:
      NODE_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: sakumari_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/sakumari_test
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/sakumari_test
      AUTH_URL: http://localhost:3000
      CREDS_PROVIDER: true
      CREDS_TEST_EMAIL: test@sakumari.local
      CREDS_TEST_PASSWORD: TestPassword123!
    
    resource_class: medium+
    
    steps:
      - checkout
      
      - run:
          name: Install PostgreSQL
          command: |
            sudo apt-get update
            sudo apt-get install -y postgresql postgresql-contrib
            sudo service postgresql start
            sudo -u postgres createdb sakumari_test
      
      - run:
          name: Install pnpm
          command: |
            corepack enable
            corepack prepare pnpm@latest --activate
      
      - restore_cache:
          keys:
            - pnpm-deps-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-deps-v1-
      
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      
      - save_cache:
          key: pnpm-deps-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
      
      - run:
          name: Wait for PostgreSQL
          command: |
            until nc -z localhost 5432; do
              echo "Waiting for PostgreSQL..."
              sleep 2
            done
            echo "PostgreSQL is ready!"
      
      - run:
          name: Setup Database
          command: |
            pnpm run prisma:generate
            pnpm run prisma:migrate deploy
            pnpm run db:seed
      
      - run:
          name: Build Application
          command: pnpm run test:e2e:build
      
      - run:
          name: Run Auth Setup
          command: |
            npx playwright test --project=setup
      
      - run:
          name: Run Playwright Tests
          command: |
            SHARD=$((CIRCLE_NODE_INDEX + 1))
            npx playwright test --shard=${SHARD}/${CIRCLE_NODE_TOTAL} --project=chromium --project=firefox --project=webkit --project=seo-chromium
      
      - store_artifacts:
          path: test-results
          destination: test-results

workflows:
  test:
    jobs:
      - e2e-tests