apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-tunnel
  namespace: sakumari
  labels:
    app: cloudflare-tunnel
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-tunnel
  template:
    metadata:
      labels:
        app: cloudflare-tunnel
        environment: production
    spec:
      # securityContext removed for compatibility
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token-file
            - /etc/cloudflared-token/token
          volumeMounts:
            - name: tunnel-token
              mountPath: /etc/cloudflared-token
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          # securityContext removed for compatibility
          livenessProbe:
            httpGet:
              path: /ready
              port: 20241
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 20241
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: tunnel-token
          secret:
            secretName: sakumari-secrets
            items:
              - key: CLOUDFLARE_TUNNEL_TOKEN
                path: token
      restartPolicy: Always
