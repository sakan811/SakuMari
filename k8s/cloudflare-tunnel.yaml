apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-tunnel
  namespace: sakumari
  labels:
    app: cloudflare-tunnel
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-tunnel
  template:
    metadata:
      labels:
        app: cloudflare-tunnel
        environment: production
    spec:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --config
        - /etc/cloudflared/config.yaml
        - --no-autoupdate
        - run
        - --token-file
        - /etc/cloudflared-token/token
        volumeMounts:
        - name: tunnel-config
          mountPath: /etc/cloudflared
          readOnly: true
        - name: tunnel-token
          mountPath: /etc/cloudflared-token
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 2000
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: tunnel-config
        configMap:
          name: cloudflare-tunnel-config
      - name: tunnel-token
        secret:
          secretName: sakumari-secrets
          items:
          - key: CLOUDFLARE_TUNNEL_TOKEN
            path: token
      restartPolicy: Always
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-tunnel-config
  namespace: sakumari
  labels:
    app: cloudflare-tunnel
    environment: production