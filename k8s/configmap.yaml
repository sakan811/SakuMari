apiVersion: v1
kind: ConfigMap
metadata:
  name: sakumari-config
  namespace: sakumari
  labels:
    app: sakumari
    environment: production
data:
  NODE_ENV: "production"
  POSTGRES_DB: "sakumari"
  POSTGRES_USER: "sakumari"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  # Prisma connection URLs - will be constructed automatically by lib/env.ts
  POSTGRES_PRISMA_URL: "postgresql://sakumari:${POSTGRES_PASSWORD}@postgres-service:5432/sakumari?pgbouncer=true&connect_timeout=15"
  POSTGRES_URL_NON_POOLING: "postgresql://sakumari:${POSTGRES_PASSWORD}@postgres-service:5432/sakumari"
  AUTH_URL: "https://sakumari.fukudev.org"
  PGADMIN_DEFAULT_EMAIL: "admin@sakumari.local"