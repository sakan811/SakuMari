apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-exporter
  namespace: sakumari
  labels:
    app: pg-exporter
    environment: production
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: pg-exporter
  template:
    metadata:
      labels:
        app: pg-exporter
        environment: production
    spec:
      containers:
        - name: pg-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          ports:
            - containerPort: 9187
              name: metrics
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: POSTGRES_PASSWORD
            - name: DATA_SOURCE_URI
              value: "postgres-service:5432/$(POSTGRES_DB)?sslmode=disable"
            - name: DATA_SOURCE_USER
              value: "$(POSTGRES_USER)"
            - name: DATA_SOURCE_PASS
              value: "$(POSTGRES_PASSWORD)"
            - name: PG_EXPORTER_EXTEND_QUERY_PATH
              value: "/etc/postgres_exporter/queries.yaml"
          volumeMounts:
            - name: queries-config
              mountPath: /etc/postgres_exporter/
              readOnly: true
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
      volumes:
        - name: queries-config
          configMap:
            name: pg-exporter-queries
            defaultMode: 0444
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-exporter-queries
  namespace: sakumari
  labels:
    app: pg-exporter
    environment: production
data:
  queries.yaml: |
    # Custom queries for PostgreSQL exporter
    # Basic database statistics
    pg_database_size:
      query: "SELECT pg_database.datname as database, pg_database_size(pg_database.datname) as size_bytes FROM pg_database"
      master: true
      metrics:
        - database:
            usage: "LABEL"
            description: "Name of the database"
        - size_bytes:
            usage: "GAUGE"
            description: "Size of the database in bytes"

    # Table statistics for application tables
    pg_stat_user_tables:
      query: "SELECT schemaname, relname, seq_scan, seq_tup_read, idx_scan, idx_tup_fetch, n_tup_ins, n_tup_upd, n_tup_del FROM pg_stat_user_tables"
      master: true
      metrics:
        - schemaname:
            usage: "LABEL"
            description: "Schema name"
        - relname:
            usage: "LABEL" 
            description: "Table name"
        - seq_scan:
            usage: "COUNTER"
            description: "Number of sequential scans initiated on this table"
        - seq_tup_read:
            usage: "COUNTER"
            description: "Number of live rows fetched by sequential scans"
        - idx_scan:
            usage: "COUNTER"
            description: "Number of index scans initiated on this table"
        - idx_tup_fetch:
            usage: "COUNTER"
            description: "Number of live rows fetched by index scans"
        - n_tup_ins:
            usage: "COUNTER"
            description: "Number of rows inserted"
        - n_tup_upd:
            usage: "COUNTER"
            description: "Number of rows updated"
        - n_tup_del:
            usage: "COUNTER"
            description: "Number of rows deleted"

    # Connection statistics
    pg_stat_database_connections:
      query: "SELECT datname as database, numbackends as connections FROM pg_stat_database"
      master: true
      metrics:
        - database:
            usage: "LABEL"
            description: "Name of the database"
        - connections:
            usage: "GAUGE"
            description: "Number of backends currently connected to this database"
---
apiVersion: v1
kind: Service
metadata:
  name: pg-exporter-service
  namespace: sakumari
  labels:
    app: pg-exporter
    environment: production
spec:
  selector:
    app: pg-exporter
  ports:
    - port: 9187
      targetPort: 9187
      name: metrics
  type: ClusterIP