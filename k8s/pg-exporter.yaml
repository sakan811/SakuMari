apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-exporter
  namespace: sakumari
  labels:
    app: pg-exporter
    environment: production
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: pg-exporter
  template:
    metadata:
      labels:
        app: pg-exporter
        environment: production
    spec:
      containers:
        - name: pg-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
          ports:
            - containerPort: 9187
              name: metrics
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: POSTGRES_PASSWORD
            - name: DATA_SOURCE_NAME
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service:5432/$(POSTGRES_DB)?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: POSTGRES_USER
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: queries-config
              mountPath: /etc/postgres_exporter/
              readOnly: true
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
      volumes:
        - name: queries-config
          configMap:
            name: pg-exporter-queries
            defaultMode: 0444
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-exporter-queries
  namespace: sakumari
  labels:
    app: pg-exporter
    environment: production
---
apiVersion: v1
kind: Service
metadata:
  name: pg-exporter-service
  namespace: sakumari
  labels:
    app: pg-exporter
    environment: production
spec:
  selector:
    app: pg-exporter
  ports:
    - port: 9187
      targetPort: 9187
      name: metrics
  type: ClusterIP