apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace for all resources
namespace: sakumari

# Resources to deploy
resources:
  - namespace.yaml
  - postgres.yaml
  - pg-exporter.yaml
  - prom.yaml
  - grafana.yaml
  - app.yaml
  - cloudflare-tunnel.yaml

secretGenerator:
  - name: sakumari-secrets
    envs:
      - ./.env
    options:
      labels:
        app: sakumari
        environment: production

# Labels applied to all resources
labels:
  - pairs:
      app.kubernetes.io/name: sakumari
      app.kubernetes.io/version: "1.0"
      app.kubernetes.io/managed-by: kustomize

# Images to use (can be overridden per environment)
images:
  - name: sakanbeer88/sakumari
    newTag: latest
