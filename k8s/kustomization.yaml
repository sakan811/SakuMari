apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace for all resources
namespace: sakumari

# Resources to deploy
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - pgadmin.yaml
  - portainer.yaml
  - app.yaml
  - ingress.yaml
  - cloudflare-tunnel.yaml

# Generate secrets from .env file
secretGenerator:
  - name: sakumari-secrets
    envs:
      - ../.env
    options:
      labels:
        app: sakumari
        environment: production

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/name: sakumari
  app.kubernetes.io/version: "1.0"
  app.kubernetes.io/managed-by: kustomize

# Images to use (can be overridden per environment)
images:
  - name: sakanbeer88/sakumari
    newTag: latest