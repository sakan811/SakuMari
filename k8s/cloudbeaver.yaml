apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbeaver
  namespace: sakumari
  labels:
    app: cloudbeaver
    environment: production
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cloudbeaver
  template:
    metadata:
      labels:
        app: cloudbeaver
        environment: production
    spec:
      containers:
        - name: cloudbeaver
          image: dbeaver/cloudbeaver:latest
          ports:
            - containerPort: 8978
          env:
            - name: CB_SERVER_NAME
              value: "SakuMari Database Admin"
            - name: CB_ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: CB_ADMIN_NAME
            - name: CB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: CB_ADMIN_PASSWORD
          readinessProbe:
            httpGet:
              path: /
              port: 8978
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8978
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: cloudbeaver-service
  namespace: sakumari
  labels:
    app: cloudbeaver
    environment: production
spec:
  selector:
    app: cloudbeaver
  ports:
    - port: 8978
      targetPort: 8978
      name: http
  type: ClusterIP