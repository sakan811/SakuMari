apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sakumari-ingress
  namespace: sakumari
  labels:
    app: sakumari
    environment: production
  annotations:
    # NGINX Ingress Controller annotations
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit-rps: "100"
    nginx.ingress.kubernetes.io/rate-limit-connections: "10"
    
    # SSL/TLS with cert-manager
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    cert-manager.io/acme-challenge-type: http01
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - sakumari.fukudev.org
    secretName: sakumari-tls
  - hosts:
    - sakumari-pgadmin.fukudev.org
    secretName: pgadmin-tls
  - hosts:
    - sakumari-portainer.fukudev.org
    secretName: portainer-tls
  rules:
  - host: sakumari.fukudev.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sakumari-app-service
            port:
              number: 3000
  - host: sakumari-pgadmin.fukudev.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pgadmin-service
            port:
              number: 80
  - host: sakumari-portainer.fukudev.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portainer-service
            port:
              number: 9000