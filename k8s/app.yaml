apiVersion: apps/v1
kind: Deployment
metadata:
  name: sakumari-app
  namespace: sakumari
  labels:
    app: sakumari-app
    environment: production
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: sakumari-app
  template:
    metadata:
      labels:
        app: sakumari-app
        environment: production
    spec:
      securityContext: {}
      containers:
        - name: app
          image: sakanbeer88/sakumari:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: NODE_ENV
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: POSTGRES_PORT
            - name: AUTH_URL
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: AUTH_URL
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_PRISMA_URL
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: POSTGRES_PRISMA_URL
            - name: POSTGRES_URL_NON_POOLING
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: POSTGRES_URL_NON_POOLING
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: AUTH_SECRET
            - name: AUTH_GOOGLE_ID
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: AUTH_GOOGLE_ID
            - name: AUTH_GOOGLE_SECRET
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: AUTH_GOOGLE_SECRET
            - name: CREDS_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: CREDS_PROVIDER
            - name: CREDS_TEST_EMAIL
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: CREDS_TEST_EMAIL
            - name: CREDS_TEST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: CREDS_TEST_PASSWORD
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: GEMINI_API_KEY
            - name: MODEL_NAME
              valueFrom:
                secretKeyRef:
                  name: sakumari-secrets
                  key: MODEL_NAME
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: sakumari-app-service
  namespace: sakumari
  labels:
    app: sakumari-app
    environment: production
spec:
  selector:
    app: sakumari-app
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
