name: sakumari
# Docker services for local development and testing
# Complete isolated stack for validation and demonstrations
services:
  # PostgreSQL database for local development
  db:
    image: postgres:17-alpine
    container_name: ${CONTAINER_NAME_PREFIX:-sakumari}-db
    ports:
      - "5432:5432"
    env_file: ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - sakumari

  # Redis for rate limiting
  redis:
    image: redis:latest
    container_name: ${CONTAINER_NAME_PREFIX:-sakumari}-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - sakumari

  # SakuMari application (local development build)
  app:
    build:
      context: ..
      dockerfile: docker/${DOCKERFILE:-Dockerfile}
    container_name: ${CONTAINER_NAME_PREFIX:-sakumari}-app
    ports:
      - "3000:3000"
    env_file: ../.env
    environment:
      CREDS_PROVIDER: ${CREDS_PROVIDER:-false}
      POSTGRES_HOST: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    user: "nextjs:nodejs"
    networks:
      - sakumari

volumes:
  postgres_data:
  redis_data:

networks:
  sakumari:
    driver: bridge
    name: sakumari
