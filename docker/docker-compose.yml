name: sakumari
# Docker services for local development and testing
# Complete isolated stack for validation and demonstrations
services:
  # PostgreSQL database for local development
  db:
    image: postgres:17-alpine
    container_name: ${CONTAINER_NAME_PREFIX:-sakumari}-db
    ports:
      - "5432:5432"
    env_file: ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - sakumari

  # DBGate for database management
  dbgate:
    image: dbgate/dbgate:latest
    container_name: ${CONTAINER_NAME_PREFIX:-sakumari}-dbgate
    ports:
      - "8080:3000"
    volumes:
      - dbgate_data:/root/.dbgate
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - sakumari

  # SakuMari application (local development build)
  app:
    build:
      context: ..
      dockerfile: docker/${DOCKERFILE:-Dockerfile}
    container_name: ${CONTAINER_NAME_PREFIX:-sakumari}-app
    ports:
      - "3000:3000"
    env_file: ../.env
    environment:
      CREDS_PROVIDER: ${CREDS_PROVIDER:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    user: "nextjs:nodejs"
    networks:
      - sakumari

volumes:
  postgres_data:
  dbgate_data:

networks:
  sakumari:
    driver: bridge
    name: sakumari
