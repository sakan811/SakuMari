name: sakumari
# Local development services only
# Production deployment uses Kubernetes (see k8s/ directory)
services:
  # PostgreSQL database for local development
  db:
    image: postgres:17-alpine
    container_name: ${CONTAINER_NAME_PREFIX:-sakumari}-db
    ports:
      - "5432:5432"
    env_file: ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - sakumari

  # pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${CONTAINER_NAME_PREFIX:-sakumari}-pgadmin
    ports:
      - "8080:80"
    env_file: ../.env
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - sakumari

  # SakuMari application (local development build)
  app:
    build:
      context: ..
      dockerfile: docker/${DOCKERFILE:-Dockerfile}
    container_name: ${CONTAINER_NAME_PREFIX:-sakumari}-app
    ports:
      - "3000:3000"
    env_file: ../.env
    environment:
      CREDS_PROVIDER: ${CREDS_PROVIDER:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    user: "nextjs:nodejs"
    networks:
      - sakumari

volumes:
  postgres_data:
  pgadmin_data:

networks:
  sakumari:
    driver: bridge
    name: sakumari
