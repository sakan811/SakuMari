name: sakumari-prod

# Production Docker Compose for SakuMari Kana Flashcard App
# Includes PostgreSQL database, Next.js app, and Cloudflare tunnel for secure access
# Optimized for self-hosting with security and reliability focus

services:
  # PostgreSQL database for production
  db:
    image: postgres:17-alpine
    container_name: ${CONTAINER_NAME_PREFIX:-sakumari}-prod-db
    env_file: ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      # Ensure production database configuration
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sakumari}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always
    networks:
      - sakumari-prod
    # Internal port only - no external exposure for security
    expose:
      - "5432"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql

  # SakuMari Next.js application
  app:
    image: ${DOCKER_IMAGE_NAME:-sakumari}:${DOCKER_IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME_PREFIX:-sakumari}-prod-app
    env_file: ../.env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: db
      # Disable credentials provider in production by default
      CREDS_PROVIDER: ${CREDS_PROVIDER:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - sakumari-prod
    # Internal port only - access via Cloudflare tunnel
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Cloudflare tunnel for secure remote access
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ${CONTAINER_NAME_PREFIX:-sakumari}-tunnel
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
    restart: always
    networks:
      - sakumari-prod
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # DBGate database admin for production database management
  dbgate:
    image: dbgate/dbgate:latest
    container_name: ${CONTAINER_NAME_PREFIX:-sakumari}-prod-dbgate
    volumes:
      - dbgate_data:/root/.dbgate
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - sakumari-prod
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /root/.dbgate

volumes:
  postgres_data:
    driver: local
  dbgate_data:
    driver: local

networks:
  sakumari-prod:
    driver: bridge
    name: sakumari-prod
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16